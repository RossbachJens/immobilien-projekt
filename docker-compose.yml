
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: immobilien
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      # Laufzeitverbindung der App als eingeschränkter app_user (RLS greift
      # nur für Nicht-Superuser, siehe Migration 0014_row_level_security).
      DATABASE_URL: postgresql+psycopg://app_user:app_user_dev_password@db:5432/immobilien
      # Für 'alembic upgrade head' (DDL/CREATE ROLE/GRANT) - bewusst
      # weiterhin Superuser, siehe backend/alembic/env.py.
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/immobilien
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data: